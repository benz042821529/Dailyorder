<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการสินค้า</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fb-loader"><div class="fb-spinner"></div><p>กำลังโหลดข้อมูล...</p></div>
<!-- PIN LOCK OVERLAY -->
<div id="pin-overlay" class="pin-overlay">
  <div class="pin-title">🔐 หลังบ้าน</div>
  <div class="pin-sub">ใส่รหัส 4 หลัก</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-err" id="pin-err"></div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key del" onclick="pinDel()">⌫</button>
    <button class="pin-key zero" onclick="pinKey('0')">0</button>
    <button class="pin-key del" onclick="pinClear()">✕</button>
  </div>
  <button onclick="window.location.href='staff.html'"
    style="background:transparent;border:none;color:#a5d6a7;font-size:13px;
    font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:4px;">
    ← กลับหน้าพนักงาน
  </button>
</div>

<script>
const ADMIN_PIN = '1234'; // ← เปลี่ยนรหัสที่นี่
let pinVal = '';

function pinKey(k) {
  if (pinVal.length >= 4) return;
  pinVal += k;
  updateDots();
  if (pinVal.length === 4) checkPin();
}
function pinDel() { pinVal = pinVal.slice(0,-1); updateDots(); document.getElementById('pin-err').textContent=''; }
function pinClear() { pinVal = ''; updateDots(); document.getElementById('pin-err').textContent=''; }
function updateDots() {
  for(let i=0;i<4;i++) {
    document.getElementById('d'+i).className = 'pin-dot' + (i < pinVal.length ? ' filled' : '');
  }
}
function checkPin() {
  if (pinVal === ADMIN_PIN) {
    sessionStorage.setItem('stock_admin','1');
    document.getElementById('pin-overlay').classList.add('hide');
  } else {
    document.getElementById('pin-err').textContent = 'รหัสไม่ถูกต้อง';
    pinVal = '';
    updateDots();
  }
}
// ตรวจสอบ session
if (sessionStorage.getItem('stock_admin') === '1') {
  document.getElementById('pin-overlay').classList.add('hide');
}
</script>

<div class="container">
  <div class="header">
    <h1>⚙️ จัดการ</h1>
    <p>สินค้าและหมวดหมู่</p>
  </div>

  <nav class="nav nav-4">
    <a href="index.html"><span>📦</span>สต็อก</a>
    <a href="manage.html" class="active"><span>⚙️</span>จัดการ</a>
    <a href="history.html"><span>📋</span>ประวัติ</a>
  <a href="staff.html" onclick="sessionStorage.removeItem('stock_admin')"><span>👤</span>พนักงาน</a>
  </nav>

  <!-- tabs -->
  <div class="btn-row" style="margin-bottom:14px;">
    <button class="btn btn-green" id="tab-item-btn" onclick="switchTab('item')" style="flex:1;">+ เพิ่มสินค้า</button>
    <button class="btn" id="tab-list-btn" onclick="switchTab('list')" style="flex:1;">📋 รายการ</button>
    <button class="btn" id="tab-cat-btn"  onclick="switchTab('cat')"  style="flex:1;">🏷 หมวดหมู่</button>
  </div>

  <!-- เพิ่มสินค้า -->
  <div id="view-item">
    <div class="card">
      <p class="card-title">เพิ่มสินค้าใหม่</p>
      <div class="input-group">
        <input type="text" id="new-name" placeholder="ชื่อสินค้า"/>
        <input type="text" id="new-unit" placeholder="หน่วย" style="flex:0.45;"/>
      </div>
      <div class="input-group">
        <select id="new-cat"><option value="">-- หมวดหมู่ --</option></select>
        <input type="number" id="new-price" placeholder="ราคาขาย (บาท)" min="0" inputmode="decimal" style="flex:1;"/>
      </div>
      <div class="input-group">
        <input type="number" id="new-stock"       placeholder="สต็อกวันแรก" min="0" inputmode="numeric"/>
        <input type="number" id="new-minstock"    placeholder="แจ้งเตือนเมื่อ ≤" min="0" inputmode="numeric" style="flex:0.7;"/>
      </div>
      <div class="input-group">
        <input type="number" id="new-dailystock"  placeholder="สต็อกเริ่มต้น/วัน (รีเซ็ตทุกวัน)" min="0" inputmode="numeric"/>
      </div>
      <button class="btn btn-green btn-full" onclick="addItem()">+ เพิ่มสินค้า</button>
    </div>
  </div>

  <!-- รายการสินค้า -->
  <div id="view-list" style="display:none;">
    <div id="item-list"></div>
  </div>

  <!-- หมวดหมู่ -->
  <div id="view-cat" style="display:none;">
    <div class="card">
      <p class="card-title">เพิ่มหมวดหมู่</p>
      <div class="input-group">
        <input type="text" id="new-cat-name" placeholder="ชื่อหมวดหมู่"/>
        <button class="btn btn-green" onclick="addCat()" style="flex:none;padding:0 16px;">เพิ่ม</button>
      </div>
    </div>
    <div id="cat-list"></div>
  </div>
</div>

<div id="modal" class="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script>
let items = [], cats = [];

function init() {
  items = STOCK.getItems();
  cats  = STOCK.getCats();
  refreshCatSelect();
}

function switchTab(t) {
  ['item','list','cat'].forEach(x => {
    document.getElementById('view-'+x).style.display = x===t ? 'block' : 'none';
  });
  document.getElementById('tab-item-btn').className = 'btn' + (t==='item'?' btn-green':'');
  document.getElementById('tab-list-btn').className = 'btn' + (t==='list'?' btn-green':'');
  document.getElementById('tab-cat-btn').className  = 'btn' + (t==='cat' ?' btn-green':'');
  if (t==='list') renderItemList();
  if (t==='cat')  renderCatList();
}

function refreshCatSelect() {
  const sel = document.getElementById('new-cat');
  sel.innerHTML = '<option value="">-- หมวดหมู่ --</option>' +
    cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// ─── เพิ่มสินค้า ───
function addItem() {
  const name     = document.getElementById('new-name').value.trim();
  const unit     = document.getElementById('new-unit').value.trim() || 'ชิ้น';
  const catId    = document.getElementById('new-cat').value || '';
  const price    = parseFloat(document.getElementById('new-price').value)    || 0;
  const stock      = parseInt(document.getElementById('new-stock').value)       || 0;
  const minStock   = parseInt(document.getElementById('new-minstock').value)    || 5;
  const dailyStock = document.getElementById('new-dailystock').value !== ''
    ? parseInt(document.getElementById('new-dailystock').value) : null;
  if (!name) { toast('กรุณาใส่ชื่อสินค้า', 'warn'); return; }
  items.push({ id: String(Date.now()), name, unit, catId, sellPrice: price, stock, minStock, dailyStock });
  STOCK.setItems(items);
  ['new-name','new-unit','new-price','new-stock','new-minstock','new-dailystock'].forEach(id => {
    document.getElementById(id).value = '';
  });
  toast(`เพิ่ม "${name}" เรียบร้อย`);
}

// ─── รายการสินค้า ───
function renderItemList() {
  items = STOCK.getItems();
  const el = document.getElementById('item-list');
  if (!items.length) { el.innerHTML = '<div class="empty">ยังไม่มีสินค้า</div>'; return; }

  // จัดกลุ่มตามหมวด
  const groups = {};
  items.forEach(it => {
    const k = it.catId || '__none';
    if (!groups[k]) groups[k] = [];
    groups[k].push(it);
  });

  let html = '';
  cats.forEach(c => {
    if (!groups[c.id]?.length) return;
    html += `<div style="font-size:13px;font-weight:700;color:#2e7d32;padding:10px 0 6px;border-bottom:1px solid #c8e6c9;margin-bottom:8px;">${c.name}</div>`;
    groups[c.id].forEach(it => { html += itemRow(it); });
  });
  if (groups['__none']?.length) {
    html += `<div style="font-size:13px;font-weight:700;color:#888;padding:10px 0 6px;border-bottom:1px solid #eee;margin-bottom:8px;">ไม่ระบุหมวด</div>`;
    groups['__none'].forEach(it => { html += itemRow(it); });
  }
  el.innerHTML = html || '<div class="empty">ยังไม่มีสินค้า</div>';
}

function itemRow(it) {
  const catName = cats.find(c => c.id === it.catId)?.name || '';
  return `<div class="manage-row">
    <div class="manage-info">
      <div class="manage-name">${it.name}</div>
      <div class="manage-meta">${it.unit}${it.sellPrice?' · '+fmt(it.sellPrice):''} · สต็อก ${it.stock||0} · รีเซ็ต/วัน ${it.dailyStock!==null&&it.dailyStock!==undefined?it.dailyStock:'—'}</div>
    </div>
    <button class="btn" style="height:32px;padding:0 10px;font-size:12px;flex:none;margin-right:4px;"
      onclick="editItemModal('${it.id}')">แก้ไข</button>
    <button class="btn btn-red" style="height:32px;padding:0 10px;font-size:12px;flex:none;"
      onclick="deleteItem('${it.id}')">ลบ</button>
  </div>`;
}

function editItemModal(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  const catOpts = '<option value="">-- หมวดหมู่ --</option>' +
    cats.map(c => `<option value="${c.id}"${c.id===it.catId?' selected':''}>${c.name}</option>`).join('');
  openModal(`แก้ไข: ${it.name}`,
    `<div style="display:flex;flex-direction:column;gap:10px;">
       <div>
         <div style="font-size:11px;color:#888;margin-bottom:4px;">ชื่อสินค้า</div>
         <input class="inp" type="text" id="e-name" value="${it.name}" placeholder="ชื่อสินค้า" style="width:100%;"/>
       </div>
       <div style="display:flex;gap:8px;">
         <div style="flex:1;">
           <div style="font-size:11px;color:#888;margin-bottom:4px;">หน่วย (เช่น กล่อง, ถุง, ชิ้น)</div>
           <input class="inp" type="text" id="e-unit" value="${it.unit}" placeholder="หน่วย" style="width:100%;"/>
         </div>
         <div style="flex:1;">
           <div style="font-size:11px;color:#888;margin-bottom:4px;">หมวดหมู่</div>
           <select class="inp" id="e-cat" style="width:100%;">${catOpts}</select>
         </div>
       </div>
       <div>
         <div style="font-size:11px;color:#888;margin-bottom:4px;">ราคาขาย (บาท/หน่วย)</div>
         <input class="inp" type="number" id="e-price" value="${it.sellPrice||''}" placeholder="เช่น 45" min="0" style="width:100%;"/>
       </div>
       <div style="display:flex;gap:8px;">
         <div style="flex:1;">
           <div style="font-size:11px;color:#888;margin-bottom:4px;">สต็อกตอนนี้</div>
           <input class="inp" type="number" id="e-stock" value="${it.stock||0}" min="0" style="width:100%;"/>
         </div>
         <div style="flex:1;">
           <div style="font-size:11px;color:#888;margin-bottom:4px;">แจ้งเตือนเมื่อเหลือ ≤</div>
           <input class="inp" type="number" id="e-minstock" value="${it.minStock||5}" min="0" style="width:100%;"/>
         </div>
       </div>
       <div>
         <div style="font-size:11px;color:#888;margin-bottom:4px;">สต็อกเริ่มต้น/วัน (รีเซ็ตทุกวัน — เว้นว่างถ้าไม่ต้องการ)</div>
         <input class="inp" type="number" id="e-dailystock"
           value="${it.dailyStock!==null&&it.dailyStock!==undefined?it.dailyStock:''}"
           placeholder="เช่น 10" min="0" style="width:100%;"/>
       </div>
     </div>`,
    `<button class="btn btn-green" style="flex:1" onclick="saveEdit('${id}')">บันทึก</button>
     <button class="btn" style="flex:1" onclick="closeModal()">ยกเลิก</button>`
  );
}

function saveEdit(id) {
  const name     = document.getElementById('e-name').value.trim();
  const unit     = document.getElementById('e-unit').value.trim() || 'ชิ้น';
  const catId    = document.getElementById('e-cat').value || '';
  const price    = parseFloat(document.getElementById('e-price').value)    || 0;
  const stock      = parseInt(document.getElementById('e-stock').value)       || 0;
  const minStock   = parseInt(document.getElementById('e-minstock').value)    || 5;
  const dsVal      = document.getElementById('e-dailystock').value;
  const dailyStock = dsVal !== '' ? parseInt(dsVal) : null;
  if (!name) { toast('กรุณาใส่ชื่อสินค้า', 'warn'); return; }
  items = items.map(it => it.id === id ? { ...it, name, unit, catId, sellPrice: price, stock, minStock, dailyStock } : it);
  STOCK.setItems(items);
  closeModal();
  renderItemList();
  toast('บันทึกเรียบร้อย');
}

function deleteItem(id) {
  const it = items.find(x => x.id === id);
  if (!confirm(`ลบ "${it.name}" ออกจากรายการ?`)) return;
  items = items.filter(x => x.id !== id);
  STOCK.setItems(items);
  renderItemList();
  toast('ลบเรียบร้อย');
}

// ─── หมวดหมู่ ───
function renderCatList() {
  cats = STOCK.getCats();
  const el = document.getElementById('cat-list');
  if (!cats.length) { el.innerHTML = '<div class="empty">ยังไม่มีหมวดหมู่</div>'; return; }
  el.innerHTML = cats.map(c => {
    const cnt = items.filter(it => it.catId === c.id).length;
    return `<div class="cat-row">
      <div class="manage-info">
        <div class="manage-name">🏷 ${c.name}</div>
        <div class="manage-meta">${cnt} สินค้า</div>
      </div>
      <button class="btn btn-red" style="height:32px;padding:0 12px;font-size:13px;flex:none;"
        onclick="deleteCat('${c.id}')">ลบ</button>
    </div>`;
  }).join('');
}

function addCat() {
  const name = document.getElementById('new-cat-name').value.trim();
  if (!name) { toast('กรุณาใส่ชื่อหมวดหมู่', 'warn'); return; }
  if (cats.find(c => c.name === name)) { toast('มีหมวดนี้แล้ว', 'warn'); return; }
  cats.push({ id: String(Date.now()), name });
  STOCK.setCats(cats);
  document.getElementById('new-cat-name').value = '';
  refreshCatSelect();
  renderCatList();
  toast(`เพิ่มหมวด "${name}" เรียบร้อย`);
}

function deleteCat(id) {
  const c = cats.find(x => x.id === id);
  const cnt = items.filter(it => it.catId === id).length;
  if (!confirm(`ลบหมวด "${c.name}"?\nสินค้า ${cnt} รายการจะถูกย้ายไป "ไม่ระบุหมวด"`)) return;
  cats = cats.filter(x => x.id !== id);
  items = items.map(it => it.catId === id ? { ...it, catId: '' } : it);
  STOCK.setCats(cats);
  STOCK.setItems(items);
  refreshCatSelect();
  renderCatList();
  toast('ลบหมวดหมู่เรียบร้อย');
}
</script>
</body>
</html>
